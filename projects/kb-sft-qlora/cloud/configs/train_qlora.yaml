model_id: Qwen/Qwen3-8B
# Downloaded on the ModelScope instance; resolve_model falls back to model_id.
model_local_dir: /mnt/data/models/Qwen3-8B
# Self-contained package: data lives under cloud/data/.
train_file: cloud/data/kb_sft_all.jsonl
dev_file: cloud/data/kb_sft_all.jsonl
output_dir: cloud/runs/qwen3-8b-kb-lora
seed: 42

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

sft:
  max_length: 4096
  packing: false
  completion_only_loss: true
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 2
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  optim: paged_adamw_8bit
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  eval_strategy: "no"
  report_to: "none"
  dataloader_num_workers: 2

smoke:
  max_samples: 200
  max_steps: 20
