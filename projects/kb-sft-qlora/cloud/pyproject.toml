[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-sft-train"
version = "0.1.0"
description = "Cloud GPU QLoRA training and evaluation for Qwen3-8B KB QA"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.11.0",
  "transformers==5.5.0",
  "peft==0.20.0",
  "trl==0.24.0",
  "datasets==4.3.0",
  "accelerate==1.14.0",
  "bitsandbytes==0.50.1",
  "modelscope==1.39.1",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
unsloth = ["unsloth==2026.8.19"]
dev = ["pytest>=8.0", "sentencepiece>=0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# torch cu128 wheels live on the PyTorch index, not PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
